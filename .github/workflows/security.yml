name: security

# gitleaks (lộ secret, cả lịch sử git) + Trivy (secret / misconfig / lỗ hổng phụ thuộc) + Semgrep (SAST C# và workflow).
# Chạy mỗi PR/push và hằng tuần (cơ sở dữ liệu lỗ hổng thay đổi dù code không đổi).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # quét toàn bộ lịch sử, không chỉ commit mới nhất
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Chỉ cần với repo thuộc Organization (tài khoản cá nhân thì không):
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-dirs: SkyGate/Library,SkyGate/Temp,SkyGate/Logs,SkyGate/obj
          trivyignores: .trivyignore

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMGREP_VERSION: "1.185.0"
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
      - name: Validate custom rules
        run: semgrep --validate --config .semgrep/ --metrics=off
      - name: Scan
        run: |
          semgrep scan \
            --config .semgrep/ \
            --config p/csharp \
            --config p/secrets \
            --config p/github-actions \
            --exclude SkyGate/Library --exclude SkyGate/Temp --exclude plan \
            --error --metrics=off
